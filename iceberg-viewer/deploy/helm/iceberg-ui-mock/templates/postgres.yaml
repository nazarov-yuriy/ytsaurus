{{- if .Values.postgres.enabled }}
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "iceberg-ui-mock.postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iceberg-ui-mock.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "iceberg-ui-mock.postgres.password" . | quote }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "iceberg-ui-mock.postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iceberg-ui-mock.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.postgres.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iceberg-ui-mock.postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iceberg-ui-mock.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # single PVC writer
  selector:
    matchLabels:
      {{- include "iceberg-ui-mock.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iceberg-ui-mock.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      annotations:
        checksum/postgres-credentials: {{ include "iceberg-ui-mock.postgres.credentialsChecksum" . }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (include "iceberg-ui-mock.postgres.fullname" .) }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    # POSTGRES_PASSWORD initializes an empty data directory only.
                    # Reconcile an existing role through the trusted local socket.
                    for attempt in $(seq 1 60); do
                      if psql --host=/var/run/postgresql \
                          --username="$POSTGRES_USER" \
                          --dbname="$POSTGRES_DB" \
                          --set=ON_ERROR_STOP=1 <<'SQL'
                    \getenv new_password POSTGRES_PASSWORD
                    ALTER ROLE CURRENT_USER WITH PASSWORD :'new_password';
                    SQL
                      then
                        exit 0
                      fi
                      sleep 2
                    done
                    echo "failed to reconcile the PostgreSQL role password" >&2
                    exit 1
          ports:
            - name: postgres
              containerPort: 5432
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "iceberg-ui-mock.postgres.fullname" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iceberg-ui-mock.postgres.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iceberg-ui-mock.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    {{- include "iceberg-ui-mock.postgres.selectorLabels" . | nindent 4 }}
{{- end }}
