{{- include "iceberg-ui-mock.mock.validateReplicas" . -}}
{{- if .Values.mockBackend.sourcesFromConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "iceberg-ui-mock.mock.sourcesName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iceberg-ui-mock.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "files/*").AsConfig | indent 2 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iceberg-ui-mock.mock.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iceberg-ui-mock.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mockBackend.replicaCount }}
  selector:
    matchLabels:
      {{- include "iceberg-ui-mock.mock.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iceberg-ui-mock.labels" . | nindent 8 }}
        app.kubernetes.io/component: mock-backend
      annotations:
        # Roll pods when the embedded backend sources change.
        checksum/sources: {{ (.Files.Glob "files/*").AsConfig | sha256sum }}
        {{- if ne (include "iceberg-ui-mock.auth.mode" .) "none" }}
        checksum/robot-token: {{ include "iceberg-ui-mock.auth.robotToken" . | sha256sum }}
        {{- end }}
        {{- if .Values.postgres.enabled }}
        checksum/postgres-credentials: {{ include "iceberg-ui-mock.postgres.credentialsChecksum" . }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mock-backend
          image: "{{ .Values.mockBackend.image.repository }}:{{ .Values.mockBackend.image.tag }}"
          imagePullPolicy: {{ .Values.mockBackend.image.pullPolicy }}
          {{- if .Values.mockBackend.sourcesFromConfigMap }}
          workingDir: /app
          # Stock python image lacks fastapi/uvicorn (and the PG driver);
          # install the pinned dependencies at start. Needs PyPI egress —
          # use the baked image (sourcesFromConfigMap=false) when air-gapped.
          command: ["sh", "-c", "python3 -m pip install --quiet --requirement /app/requirements.txt && exec python3 /app/server.py 8000"]
          {{- end }}
          env:
            - name: MOCK_HOST
              value: {{ include "iceberg-ui-mock.mock.proxyAddress" . | quote }}
            {{- with .Values.mockBackend.delay }}
            - name: MOCK_DELAY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mockBackend.corsOrigins }}
            - name: MOCK_CORS_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.auth.ytUpstream }}
            - name: MOCK_YT_UPSTREAM
              value: {{ . | quote }}
            {{- end }}
            {{- if ne (include "iceberg-ui-mock.auth.mode" .) "none" }}
            - name: MOCK_REQUIRE_AUTH
              value: "1"
            - name: MOCK_ROBOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "iceberg-ui-mock.ui.secretName" . }}
                  key: robot-token
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (include "iceberg-ui-mock.postgres.fullname" .) }}
                  key: password
            - name: PGHOST
              value: {{ printf "%s.%s.svc.cluster.local" (include "iceberg-ui-mock.postgres.fullname" .) .Release.Namespace | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: MOCK_PG_DSN
              value: "connect_timeout=5 application_name=iceberg-ui-mock"
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            {{- toYaml .Values.mockBackend.resources | nindent 12 }}
          {{- if .Values.mockBackend.sourcesFromConfigMap }}
          volumeMounts:
            - mountPath: /app
              name: sources
              readOnly: true
          {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.mockBackend.sourcesFromConfigMap }}
      volumes:
        - name: sources
          configMap:
            name: {{ include "iceberg-ui-mock.mock.sourcesName" . }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "iceberg-ui-mock.mock.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iceberg-ui-mock.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mockBackend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "iceberg-ui-mock.mock.selectorLabels" . | nindent 4 }}
