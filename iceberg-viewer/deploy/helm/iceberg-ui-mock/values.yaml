# Mock YT proxy (the backend under test).
mockBackend:
  replicaCount: 1
  # By default the chart runs the backend sources shipped in files/ on a stock
  # python image (no registry needed). To use a build of
  # deploy/docker/mock-backend.Dockerfile instead, set sourcesFromConfigMap=false
  # and set both image.repository and image.tag to the image you pushed.
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent
  # When true, mount server.py/data.py/webjson.py/userdb.py from the chart's ConfigMap.
  # Set to false when image.repository already contains them (baked image).
  sourcesFromConfigMap: true
  # Simulate a slow catalog, e.g. "1500" or "read_table:5000,list:2000".
  # //sys paths and infrastructure endpoints are never delayed (docs/timeouts.md).
  delay: ""
  service:
    # Port 80 keeps the clusters-config `proxy` value a bare hostname; other
    # ports are appended to the generated Service DNS address.
    port: 80
  resources: {}

# Optional real user persistence: users + login sessions in PostgreSQL
# (table data stays fake/in-RAM). When enabled, the mock gets MOCK_PG_DSN and
# the run-from-ConfigMap mode pip-installs psycopg at container start.
postgres:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  database: mockusers
  user: mock
  # database and user initialize a new PVC; migrate explicitly instead of
  # changing them after PostgreSQL has initialized persistent storage.
  # The chart reconciles this role password on every PostgreSQL pod start.
  # Alternatively point existingSecret at a Secret with key "password".
  password: mock-password
  existingSecret: ""
  # Helm cannot observe out-of-band Secret updates. Bump this value in the same
  # upgrade that rotates an existingSecret so PostgreSQL and the backend restart.
  existingSecretRevision: ""
  storage: 1Gi
  storageClassName: ""
  resources: {}

# Robot credentials used only for authenticated mock deployments. The same token
# is mounted into the UI and backend; replace the default before exposing the UI.
auth:
  robotToken: mock-robot-token

# ytsaurus-ui, deployed the same way as the official ui-helm-chart.
ui:
  replicaCount: 1
  image:
    repository: ghcr.io/ytsaurus/ui
    pullPolicy: IfNotPresent
    tag: ""  # defaults to .Chart.appVersion
  # Cluster entry the UI shows; `proxy` is filled with the mock Service DNS name
  # automatically unless overridden here.
  cluster:
    id: mock
    name: Mock cluster
    description: In-RAM mock backend (Iceberg viewer prototype)
    environment: development
    group: Mock
    theme: grapefruit
    # Empty selects "basic" with PostgreSQL and "none" otherwise. Set an explicit
    # value to override that behavior (including "none" to opt out with PG).
    authentication: ""
    proxy: ""
  env: []
  service:
    # ClusterIP keeps the unauthenticated mock private by default. Opt in to a
    # NodePort or ingress only when that exposure is intentional.
    type: ClusterIP
    port: 80
  resources: {}

settings:
  directDownload: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: iceberg-ui-mock.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
securityContext: {}
