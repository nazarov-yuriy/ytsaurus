# Mock YT proxy (the backend under test).
mockBackend:
  # Authenticated deployments without PostgreSQL keep users and sessions in
  # process memory, so the chart rejects more than one replica in that mode.
  replicaCount: 1
  # By default the chart runs the backend sources shipped in files/ on a stock
  # python image, installing the pinned requirements.txt at pod start (needs
  # PyPI egress). To use a build of deploy/docker/mock-backend.Dockerfile
  # instead (self-contained, for air-gapped clusters), set
  # sourcesFromConfigMap=false and both image.repository and image.tag.
  image:
    repository: python
    tag: "3.12-slim"
    pullPolicy: IfNotPresent
  # When true, mount server.py/data.py/webjson.py/userdb.py from the chart's ConfigMap.
  # Set to false when image.repository already contains them (baked image).
  sourcesFromConfigMap: true
  # Simulate a slow catalog, e.g. "1500" or "read_table:5000,list:2000".
  # //sys paths and infrastructure endpoints are never delayed (docs/timeouts.md).
  delay: ""
  # Exact browser origins allowed to call the backend directly with
  # credentials. Keep empty for the normal UI reverse-proxy topology.
  corsOrigins: []
  service:
    # Port 80 keeps the clusters-config `proxy` value a bare hostname; other
    # ports are appended to the generated Service DNS address.
    port: 80
  resources: {}

# Optional real user persistence: users + login sessions in PostgreSQL.
# When enabled, the mock gets MOCK_PG_DSN (the PG driver is already part of
# the always-installed requirements.txt). Table data stays fake.
postgres:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  database: mockusers
  user: mock
  # database and user initialize a new PVC; migrate explicitly instead of
  # changing them after PostgreSQL has initialized persistent storage.
  # The chart reconciles this role password on every PostgreSQL pod start.
  # Alternatively point existingSecret at a Secret with key "password".
  # Enabling PostgreSQL with this published placeholder is rejected.
  password: mock-password
  existingSecret: ""
  # Helm cannot observe out-of-band Secret updates. Bump this value in the same
  # upgrade that rotates an existingSecret so PostgreSQL and the backend restart.
  existingSecretRevision: ""
  storage: 1Gi
  storageClassName: ""
  resources: {}

# Robot credentials used only for authenticated mock deployments. The same token
# is mounted into the UI and backend. The published value is an anonymous-mode
# placeholder; chart rendering rejects it whenever authentication is enabled.
auth:
  # Anonymous access is a development-only posture and must be explicit. With
  # this false default, rendering requires PostgreSQL or auth.ytUpstream.
  allowAnonymous: false
  robotToken: mock-robot-token
  # Real YTsaurus HTTP proxy URL that verifies users not added locally; on
  # first success they are provisioned into the configured user store
  # (origin=external). A non-empty value selects basic/strict authentication
  # when ui.cluster.authentication is empty; pairing it with an explicit "none"
  # is rejected. Locally-added test users keep working without it. Empty
  # disables delegation.
  # See docs/auth.md "External authentication". Example: "https://proxy.yt.example".
  ytUpstream: ""

# ytsaurus-ui, deployed the same way as the official ui-helm-chart.
ui:
  replicaCount: 1
  image:
    repository: ghcr.io/ytsaurus/ui
    pullPolicy: IfNotPresent
    tag: ""  # defaults to .Chart.appVersion
  # Cluster entry the UI shows; `proxy` is filled with the mock Service DNS name
  # automatically unless overridden here.
  cluster:
    id: mock
    name: Mock cluster
    description: In-RAM mock backend (Iceberg viewer prototype)
    environment: development
    group: Mock
    theme: grapefruit
    # Empty selects "basic" with PostgreSQL or auth.ytUpstream. Without either,
    # rendering fails unless auth.allowAnonymous=true. An explicit "none" also
    # requires that opt-in and remains incompatible with auth.ytUpstream.
    # Explicit "basic" requires PostgreSQL or auth.ytUpstream.
    authentication: ""
    proxy: ""
  env: []
  service:
    # ClusterIP is still not an authentication boundary. Opt in to a NodePort
    # or ingress only with the intended authentication and network policy.
    type: ClusterIP
    port: 80
  resources: {}

settings:
  directDownload: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: iceberg-ui-mock.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
nodeSelector: {}
securityContext: {}
